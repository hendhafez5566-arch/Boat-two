<!doctype html>
<html lang="ar" dir="rtl">
  <head><meta charset="utf-8" /><title>تجربة الويدجت</title></head>
  <body style="font-family: sans-serif; padding: 2rem">
    <h1>صفحة تجربة الويدجت</h1>
    <p>افتح هذه الصفحة بالشكل: <code>/widget-demo.html?key=مفتاح_القناة</code></p>
    <script>
      var k = new URLSearchParams(location.search).get('key');
      if (k) fetch('/api/widget-config').then(function(r) { if (!r.ok) throw new Error('config'); return r.json(); }).then(function(config) {
        var s = document.createElement('script');
        s.src = config.scriptUrl;
        s.setAttribute('data-key', k);
        document.body.appendChild(s);
      }).catch(function() { document.body.appendChild(document.createTextNode('تعذر تحميل الويدجت. راجع إعدادات القناة والمواقع المسموحة.')); });
    </script>
  </body>
</html>
