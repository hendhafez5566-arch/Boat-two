<!doctype html>
<html lang="ar" dir="rtl">
  <head><meta charset="utf-8" /><title>تجربة الويدجت</title></head>
  <body style="font-family: sans-serif; padding: 2rem">
    <h1>صفحة تجربة الويدجت</h1>
    <p>افتح هذه الصفحة بالشكل: <code>/widget-demo.html?key=مفتاح_القناة</code></p>
    <script>
      var k = new URLSearchParams(location.search).get('key');
      if (k) {
        var s = document.createElement('script');
        s.src = 'http://localhost:4000/widget.js';
        s.setAttribute('data-key', k);
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
