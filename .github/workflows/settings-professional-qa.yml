name: Professional settings acceptance
on:
  push:
    branches: [ux/settings-professional-20261128]
  pull_request:
    branches: [fix/preview-order-summary-filter]
    paths:
      - 'apps/web/components/workspace/SettingsHub.tsx'
      - 'apps/web/components/workspace/CompanySettings.tsx'
      - 'apps/web/components/workspace/SessionsPanel.tsx'
      - 'apps/web/components/workspace/AuditPanel.tsx'
      - 'apps/web/components/workspace/IntegrationsPanel.tsx'
      - 'apps/web/components/workspace/settings-hub.module.css'
      - 'apps/api/src/workspace/workspace.controller.ts'
      - 'apps/api/src/auth/sessions.controller.ts'
      - 'apps/api/src/integrations/**'
      - 'scripts/qa-settings-professional.mjs'
      - '.github/workflows/settings-professional-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: settings-professional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        run: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api build && pnpm --filter web build
      - name: Auth and integration regression
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://qa:qa@127.0.0.1:1/qa
          REDIS_URL: redis://127.0.0.1:1
          JWT_SECRET: local-synthetic-regression-signing-key-only
          ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
          EXTERNAL_DELIVERY_ENABLED: 'false'
          AI_PROVIDER_CALLS_ENABLED: 'false'
        run: pnpm --filter api exec tsx --test src/auth/role-session.test.ts src/auth/account-profile.pg.test.ts src/integrations/contracts.test.ts src/integrations/google-oauth.test.ts src/flows/engine/integration-output.test.ts
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/boat-playwright" playwright@1.56.1 --ignore-scripts
      - name: Isolated settings browser acceptance
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-settings-professional.mjs
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-professional-evidence
          path: |
            docs/p0-evidence/settings-professional/
            /tmp/boat-journeys-api.log
            /tmp/boat-journeys-web.log
          if-no-files-found: warn
