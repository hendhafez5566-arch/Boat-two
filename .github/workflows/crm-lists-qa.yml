name: CRM audience lists task-oriented UX acceptance
on:
  push:
    branches: [feat/flow-builder-fidelity-20261107]
    paths:
      - 'apps/web/app/dashboard/crm/lists/**'
      - 'scripts/qa-crm-lists-ux.mjs'
      - '.github/workflows/crm-lists-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-lists-ux-PR14
  cancel-in-progress: true
jobs:
  isolated-crm-audience:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frozen dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build full API and Web
        run: pnpm --filter api build && pnpm --filter web build
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/boat-playwright" playwright@1.56.1 --ignore-scripts
      - name: Test CRM lists create, add, remove and responsive AR/EN
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-crm-lists-ux.mjs
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-lists-visual-evidence
          path: |
            docs/enterprise-20261115/crm-lists-ux/
            /tmp/boat-journeys-api.log
            /tmp/boat-journeys-web.log
          if-no-files-found: warn
