name: Professional reports acceptance
on:
  push:
    branches: [ux/reports-professional-20261127]
  pull_request:
    branches: [fix/preview-order-summary-filter]
    paths:
      - 'apps/web/app/dashboard/reports/**'
      - 'apps/web/components/business/CrmIntelligence.tsx'
      - 'apps/web/app/dashboard/flows/**/input-report/**'
      - 'apps/api/src/business/reports.controller.ts'
      - 'scripts/qa-reports-response-browser.mjs'
      - '.github/workflows/reports-professional-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reports-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm --filter api build && pnpm --filter web build
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/boat-playwright" playwright@1.56.1 --ignore-scripts
      - name: Run isolated bilingual report acceptance
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-reports-response-browser.mjs
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-browser-evidence
          path: |
            docs/p0-evidence/report-browser/
            /tmp/boat-journeys-api.log
            /tmp/boat-journeys-web.log
          if-no-files-found: warn
