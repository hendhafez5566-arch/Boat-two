name: Professional campaign acceptance
on:
  push:
    branches: [ux/campaigns-professional-20261127]
  pull_request:
    branches: [fix/preview-order-summary-filter]
    paths:
      - 'apps/web/app/dashboard/campaigns/**'
      - 'apps/web/components/business/*Campaign*'
      - 'apps/web/components/business/broadcast.module.css'
      - 'apps/web/components/business/campaign-configuration.module.css'
      - 'scripts/qa-campaign-professional.mjs'
      - 'scripts/qa-campaign-delivery-browser.mjs'
      - 'apps/api/src/messaging/widget.controller.ts'
      - '.github/workflows/campaign-professional-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campaign-professional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script: [qa-campaign-professional, qa-campaign-delivery-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual application
        run: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api build && pnpm --filter web build
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/boat-playwright" playwright@1.56.1 --ignore-scripts
      - name: Arabic and English campaign acceptance on mobile and desktop
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/${{ matrix.script }}.mjs
          BOAT_CLOUD_REVIEW: ${{ matrix.script == 'qa-campaign-delivery-browser' && 'true' || 'false' }}
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-${{ matrix.script }}-evidence
          path: |
            docs/p0-evidence/campaign-professional/
            docs/p0-evidence/campaign-delivery/
            /tmp/boat-journeys-api.log
            /tmp/boat-journeys-web.log
          if-no-files-found: warn
