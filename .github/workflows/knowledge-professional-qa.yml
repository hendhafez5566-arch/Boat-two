name: Professional knowledge acceptance
on:
  push:
    branches: [ux/knowledge-professional-20261128]
  pull_request:
    branches: [fix/preview-order-summary-filter]
    paths:
      - 'apps/web/components/workspace/KnowledgePanel.tsx'
      - 'apps/web/components/workspace/ai-workspace.module.css'
      - 'apps/web/components/business/Knowledge*.tsx'
      - 'apps/api/src/ai/knowledge/**'
      - 'apps/api/src/ai/ai.controller.ts'
      - 'scripts/qa-knowledge*.mjs'
      - 'scripts/qa-full-api.mjs'
      - '.github/workflows/knowledge-professional-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: knowledge-professional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        run: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api build && pnpm --filter web build
      - name: AI and retrieval regression tests
        run: pnpm --filter api exec tsx --test src/ai/ai.test.ts src/ai/catalog-grounding.test.ts src/ai/providers/embeddings.test.ts
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/boat-playwright" playwright@1.56.1 --ignore-scripts
      - name: Isolated knowledge source, indexing and retention browser acceptance
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-knowledge-professional.mjs
          BOAT_KNOWLEDGE_QA: 'true'
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-professional-evidence
          path: |
            docs/p0-evidence/knowledge-professional/
            /tmp/boat-journeys-api.log
            /tmp/boat-journeys-web.log
          if-no-files-found: warn
