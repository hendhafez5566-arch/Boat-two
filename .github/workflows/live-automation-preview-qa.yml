name: LIVE Preview automation UX real-browser verification
on:
  push:
    branches: [feat/flow-builder-fidelity-20261107]
    paths:
      - 'scripts/qa-live-automation-preview.mjs'
      - '.github/workflows/live-automation-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-preview-automation-qa
  cancel-in-progress: true
jobs:
  verify-real-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/boat-playwright" playwright@1.56.1 --ignore-scripts
      - name: Verify actual Railway Web in synthetic unpublished QA workspace
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: node scripts/qa-live-automation-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-railway-preview-automation-visual-evidence
          path: docs/enterprise-20261115/live-button-actions/
          if-no-files-found: warn
