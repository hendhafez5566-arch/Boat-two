name: Inbox WhatsApp-like readability and responsive acceptance
on:
  push:
    branches: [feat/flow-builder-fidelity-20261107]
    paths:
      - 'apps/web/app/dashboard/inbox/**'
      - 'apps/web/components/inbox/**'
      - 'scripts/qa-inbox-readability.mjs'
      - 'scripts/qa-p0-webchat-browser.mjs'
      - 'scripts/qa-reports-response-browser.mjs'
      - 'apps/web/app/dashboard/reports/**'
      - 'apps/web/app/dashboard/settings/attachments/**'
      - 'apps/web/components/workspace/SettingsHub.tsx'
      - 'scripts/qa-attachments-browser.mjs'
      - 'apps/api/assets/widget.js'
      - 'apps/web/lib/inbox-catchup.ts'
      - 'scripts/run-connect-browser-qa.py'
      - '.github/workflows/inbox-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inbox-visual-pr14
  cancel-in-progress: true
jobs:
  responsive-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked project dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build actual API and Web
        run: pnpm --filter api build && pnpm --filter web build
      - name: Install isolated Chromium browser test driver
        run: npm install --prefix "$RUNNER_TEMP/boat-playwright" playwright@1.56.1 --ignore-scripts
      - name: Verify 10 AR/EN populated Inbox journeys, readable text, high contrast and single-pane mobile layout
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-inbox-readability.mjs
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - name: Verify real Webchat backlog, uploaded image, offline reconnect and reload in AR and EN
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-p0-webchat-browser.mjs
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - name: Verify measured reports and empty averages in Arabic and English
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-reports-response-browser.mjs
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - name: Verify attachment lifecycle and linked-data protection in Arabic and English
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-attachments-browser.mjs
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - name: Upload screenshots and measured contrast results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-clarity-visual-evidence
          path: |
            docs/enterprise-20261116/inbox-readability/
            docs/p0-evidence/webchat-browser/
            docs/p0-evidence/report-browser/
            docs/p0-evidence/attachments-browser/
            /tmp/boat-journeys-api.log
            /tmp/boat-journeys-web.log
          if-no-files-found: warn
