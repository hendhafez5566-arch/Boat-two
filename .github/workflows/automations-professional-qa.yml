name: Professional automation acceptance
on:
  push:
    branches: [ux/automations-professional-20261127]
  pull_request:
    branches: [fix/preview-order-summary-filter]
    paths:
      - 'apps/web/components/workspace/AutomationsPanel.tsx'
      - 'apps/web/components/business/*Automation*.tsx'
      - 'apps/web/app/workspace-theme.css'
      - 'apps/api/src/business/operations.controller.ts'
      - 'scripts/qa-automations-professional.mjs'
      - '.github/workflows/automations-professional-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automations-professional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        run: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api build && pnpm --filter web build
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/boat-playwright" playwright@1.56.1 --ignore-scripts
      - name: Isolated automation acceptance and real event processing
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-automations-professional.mjs
          BOAT_CHROMIUM: /usr/bin/google-chrome
          BOAT_CLOUD_REVIEW: 'true'
        run: python3 scripts/run-connect-browser-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automations-professional-evidence
          path: |
            docs/p0-evidence/automations-professional/
            /tmp/boat-journeys-api.log
            /tmp/boat-journeys-web.log
          if-no-files-found: warn
