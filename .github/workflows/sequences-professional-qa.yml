name: Professional sequence acceptance
on:
  push:
    branches: [ux/sequences-professional-20261127]
  pull_request:
    branches: [fix/preview-order-summary-filter]
    paths:
      - 'apps/web/components/workspace/Sequence*.tsx'
      - 'apps/web/components/workspace/sequences.module.css'
      - 'apps/web/components/inbox/InboxSequences.tsx'
      - 'apps/web/app/sequence-builder.css'
      - 'apps/api/src/sequences/**'
      - 'scripts/qa-sequences-professional.mjs'
      - 'scripts/qa-sequence-worker*.mjs'
      - 'scripts/qa-full-api.mjs'
      - '.github/workflows/sequences-professional-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sequences-professional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script: [qa-sequences-professional, qa-sequence-worker-runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        run: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api build && pnpm --filter web build
      - name: Sequence scheduling, routing and tenant-isolated PostgreSQL tests
        run: pnpm --filter api exec tsx --test src/sequences/schedule.test.ts src/sequences/sequence-center.pg.test.ts src/flows/engine/sequence-routing.test.ts
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/boat-playwright" playwright@1.56.1 --ignore-scripts
      - name: Arabic and English mobile and desktop acceptance
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/${{ matrix.script }}.mjs
          BOAT_SEQUENCE_QA: 'true'
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequences-${{ matrix.script }}-evidence
          path: |
            docs/p0-evidence/sequences-professional/
            docs/p0-evidence/sequences-worker/
            /tmp/boat-journeys-api.log
            /tmp/boat-journeys-web.log
          if-no-files-found: warn
