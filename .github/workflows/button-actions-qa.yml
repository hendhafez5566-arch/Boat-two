name: Button actions guided UX and seven-action execution
on:
  push:
    branches: [feat/flow-builder-fidelity-20261107]
    paths:
      - 'apps/web/components/flow/**'
      - 'apps/api/src/flows/**'
      - 'scripts/qa-button-actions-ux.mjs'
      - 'scripts/run-connect-browser-qa.py'
      - '.github/workflows/button-actions-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: button-actions-PR14
  cancel-in-progress: true
jobs:
  seven-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frozen dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Type-check actual action service and build API/Web
        run: pnpm --filter api build && pnpm --filter web build
      - name: Run actual action branches against isolated adapters (no external delivery)
        working-directory: apps/api
        run: node --import tsx --test src/flows/flow-actions-seven.test.ts src/flows/flow-actions.test.ts
      - name: Install isolated browser driver
        run: npm install --prefix /tmp/boat-playwright playwright@1.56.1 --ignore-scripts
      - name: Run ten responsive AR/EN journeys, seven-action edit/save/reopen
        env:
          BOAT_PLAYWRIGHT_MODULE: /tmp/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-button-actions-ux.mjs
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - name: Upload screenshots and actual run results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: button-actions-ux-evidence
          path: |
            docs/enterprise-20261115/button-actions-acceptance/
            /tmp/boat-journeys-api.log
            /tmp/boat-journeys-web.log
          if-no-files-found: warn
