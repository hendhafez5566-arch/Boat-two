name: Product experience acceptance
on:
  push:
    branches: [feat/flow-builder-fidelity-20261107]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'scripts/qa-product-experience.mjs'
      - 'scripts/run-connect-browser-qa.py'
      - '.github/workflows/product-experience-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked project dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build API and Web
        run: pnpm --filter api build && pnpm --filter web build
      - name: Check product categories and exact money
        working-directory: apps/api
        run: node --import tsx --test src/commerce/product-categories.pg.test.ts ../../apps/web/lib/product-money.test.ts
      - name: Install isolated browser test driver
        run: npm install --prefix "$RUNNER_TEMP/boat-playwright" playwright@1.56.1 --ignore-scripts
      - name: Run isolated product journeys
        env:
          BOAT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/boat-playwright/node_modules/playwright
          BOAT_QA_BROWSER_SCRIPT: scripts/qa-product-experience.mjs
          BOAT_CHROMIUM: /usr/bin/google-chrome
        run: python3 scripts/run-connect-browser-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-experience-evidence
          path: |
            docs/enterprise-20261114/products/
            /tmp/boat-journeys-api.log
            /tmp/boat-journeys-web.log
          if-no-files-found: warn
