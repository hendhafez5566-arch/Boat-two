# Local S3-compatible acceptance ONLY; no external account or paid resource.
services:
  minio:
    build:
      context: ../..
      dockerfile: deploy/portable/S3-test.Dockerfile
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes: ['object-test:/data']
  api:
    environment:
      ATTACHMENT_STORAGE: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: boat-attachments
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PREFIX: attachments/
      S3_ALLOW_HTTP: 'true'
    depends_on:
      minio: {condition: service_started}
volumes:
  object-test:
